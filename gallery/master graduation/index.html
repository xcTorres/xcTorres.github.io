<script>
    // Drop Bootstarp low-performance Navbar
    // Use customize navbar with high-quality material design animation
    // in high-perf jank-free CSS3 implementation
    var $body   = document.body;
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function(){
            $navbar.className = " ";
            // wait until animation end.
            setTimeout(function(){
                // prevent frequently toggle
                if($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            },400)
        },
        open: function(){
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    }

    // Bind Event
    $toggle.addEventListener('click', function(e){
        if ($navbar.className.indexOf('in') > 0) {
            __HuxNav__.close()
        }else{
            __HuxNav__.open()
        }
    })

    /**
     * Since Fastclick is used to delegate 'touchstart' globally
     * to hack 300ms delay in iOS by performing a fake 'click',
     * Using 'e.stopPropagation' to stop 'touchstart' event from 
     * $toggle/$collapse will break global delegation.
     * 
     * Instead, we use a 'e.target' filter to prevent handler
     * added to document close HuxNav.  
     *
     * Also, we use 'click' instead of 'touchstart' as compromise
     */
    document.addEventListener('click', function(e){
        if(e.target == $toggle) return;
        if(e.target.className == 'icon-bar') return;
        __HuxNav__.close();
    })
</script>

<script type="text/javascript">
(function() {
    var grid = document.getElementById('photo-grid');
    var box = document.getElementById('lightbox');
    if (!grid || !box) { return; }

    var links = [].slice.call(grid.querySelectorAll('.photo-item'));
    var img = document.getElementById('lightbox-img');
    var counter = document.getElementById('lightbox-counter');
    var current = 0;

    function show(i) {
        current = (i + links.length) % links.length;
        img.src = links[current].getAttribute('href');
        counter.textContent = (current + 1) + ' / ' + links.length;
        // preload the neighbours so arrow-keying through feels instant
        [current + 1, current - 1].forEach(function(n) {
            new Image().src = links[(n + links.length) % links.length].getAttribute('href');
        });
    }

    function open(i) {
        show(i);
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
    }

    function close() {
        box.classList.remove('is-open');
        document.body.style.overflow = '';
        img.src = '';
    }

    links.forEach(function(link, i) {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            open(i);
        });
    });

    box.addEventListener('click', function(e) {
        var action = e.target.getAttribute('data-action');
        if (action === 'prev') { show(current - 1); }
        else if (action === 'next') { show(current + 1); }
        else if (action === 'close' || e.target === box || e.target.parentNode === box) { close(); }
    });

    document.addEventListener('keydown', function(e) {
        if (!box.classList.contains('is-open')) { return; }
        if (e.key === 'Escape') { close(); }
        else if (e.key === 'ArrowLeft') { show(current - 1); }
        else if (e.key === 'ArrowRight') { show(current + 1); }
    });
})();
</script>
