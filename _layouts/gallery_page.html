---
layout: default
hide-in-nav: true
---

<!-- Page Header -->
{% include intro-header.html type='page' %}

<style TYPE="text/css">
.gallery-back {
  padding-top: 30px;
  font-size: 15px;
}
/* Masonry via CSS columns: photos keep their own aspect ratio, no cropping. */
.photo-grid {
  column-count: 4;
  column-gap: 16px;
  padding: 18px 0 60px 0;
}
.photo-item {
  display: block;
  margin-bottom: 16px;
  /* stops a photo from being split across two columns */
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
  page-break-inside: avoid;
  border-radius: 3px;
  overflow: hidden;
  background-color: #f4f4f4;
  box-shadow: 0 1px 3px rgba(0,0,0,.10);
  transition: box-shadow .3s ease, transform .3s ease;
}
.photo-item:hover {
  box-shadow: 0 10px 26px rgba(0,0,0,.20);
  transform: translateY(-2px);
}
.photo-item img {
  display: block;
  width: 100%;
  height: auto;
  cursor: zoom-in;
}
@media only screen and (max-width: 1199px) { .photo-grid { column-count: 3; } }
@media only screen and (max-width: 767px)  { .photo-grid { column-count: 2; column-gap: 10px; }
                                             .photo-item { margin-bottom: 10px; } }
@media only screen and (max-width: 479px)  { .photo-grid { column-count: 1; } }

/* Lightbox */
.lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  background-color: rgba(0,0,0,.94);
}
.lightbox.is-open { display: block; }
.lightbox-stage {
  position: absolute;
  top: 54px; left: 54px; right: 54px; bottom: 54px;
  text-align: center;
}
.lightbox-stage img {
  max-width: 100%;
  max-height: 100%;
  /* centres the image in the stage whatever its shape */
  position: absolute;
  top: 0; bottom: 0; left: 0; right: 0;
  margin: auto;
  box-shadow: 0 4px 30px rgba(0,0,0,.5);
}
.lightbox-btn {
  position: absolute;
  border: 0;
  background: none;
  color: #fff;
  opacity: .65;
  cursor: pointer;
  transition: opacity .2s ease;
  line-height: 1;
  padding: 10px;
}
.lightbox-btn:hover { opacity: 1; }
.lightbox-close { top: 10px; right: 16px; font-size: 34px; }
.lightbox-prev, .lightbox-next {
  top: 50%;
  margin-top: -28px;
  font-size: 46px;
  width: 54px;
}
.lightbox-prev { left: 4px; }
.lightbox-next { right: 4px; }
.lightbox-counter {
  position: absolute;
  bottom: 16px;
  width: 100%;
  text-align: center;
  color: #fff;
  opacity: .6;
  font-size: 13px;
  letter-spacing: 1px;
}
@media only screen and (max-width: 767px) {
  .lightbox-stage { top: 44px; left: 8px; right: 8px; bottom: 44px; }
  .lightbox-prev, .lightbox-next { font-size: 34px; width: 40px; }
}
</style>

<!-- Main Content -->
<div class="container">
  <p class="gallery-back"><a href="/{{ site.gallery.dir }}">&larr; All galleries</a></p>

  <div class="photo-grid" id="photo-grid">
    {% for image in page.images %}
      <a class="photo-item" href="{{ image.name }}" data-index="{{ forloop.index0 }}">
        <img src="thumbs/{{ image.name }}" alt="{{ page.title }} {{ forloop.index }}" loading="lazy">
      </a>
    {% endfor %}
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="{{ page.title }}">
  <button class="lightbox-btn lightbox-close" data-action="close" aria-label="Close">&times;</button>
  <button class="lightbox-btn lightbox-prev"  data-action="prev"  aria-label="Previous">&lsaquo;</button>
  <button class="lightbox-btn lightbox-next"  data-action="next"  aria-label="Next">&rsaquo;</button>
  <div class="lightbox-stage"><img id="lightbox-img" src="" alt=""></div>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script type="text/javascript">
(function() {
    var grid = document.getElementById('photo-grid');
    var box = document.getElementById('lightbox');
    if (!grid || !box) { return; }

    var links = [].slice.call(grid.querySelectorAll('.photo-item'));
    var img = document.getElementById('lightbox-img');
    var counter = document.getElementById('lightbox-counter');
    var current = 0;

    function show(i) {
        current = (i + links.length) % links.length;
        img.src = links[current].getAttribute('href');
        counter.textContent = (current + 1) + ' / ' + links.length;
        // preload the neighbours so arrow-keying through feels instant
        [current + 1, current - 1].forEach(function(n) {
            new Image().src = links[(n + links.length) % links.length].getAttribute('href');
        });
    }

    function open(i) {
        show(i);
        box.classList.add('is-open');
        document.body.style.overflow = 'hidden';
    }

    function close() {
        box.classList.remove('is-open');
        document.body.style.overflow = '';
        img.src = '';
    }

    links.forEach(function(link, i) {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            open(i);
        });
    });

    box.addEventListener('click', function(e) {
        var action = e.target.getAttribute('data-action');
        if (action === 'prev') { show(current - 1); }
        else if (action === 'next') { show(current + 1); }
        else if (action === 'close' || e.target === box || e.target.parentNode === box) { close(); }
    });

    document.addEventListener('keydown', function(e) {
        if (!box.classList.contains('is-open')) { return; }
        if (e.key === 'Escape') { close(); }
        else if (e.key === 'ArrowLeft') { show(current - 1); }
        else if (e.key === 'ArrowRight') { show(current + 1); }
    });
})();
</script>
